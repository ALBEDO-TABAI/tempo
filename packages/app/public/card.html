<!doctype html>
<html><head><meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>Tempo</title>
<style>
  html, body { margin: 0; background: transparent; font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; -webkit-user-select: none; user-select: none; overflow: hidden; }
  .card { position: absolute; inset: 8px; border-radius: 10px; background: rgb(37,37,37); color: rgba(255,255,255,.92); box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 8px 24px rgba(0,0,0,.35); padding: 12px 12px 12px 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px; -webkit-app-region: no-drag; animation: in .18s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(-6px); } }
  .card::before { content: ""; position: absolute; left: 8px; top: 12px; bottom: 12px; width: 3px; border-radius: 2px; background: var(--c, #6b7cff); }
  .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 20px; }
  .s { color: rgba(255,255,255,.55); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row { display: flex; gap: 6px; margin-top: 6px; }
  button { font: inherit; font-size: 12px; height: 24px; padding: 0 10px; border-radius: 6px; border: 0; background: rgba(255,255,255,.1); color: inherit; cursor: default; }
  button:hover { background: rgba(255,255,255,.16); }
  button.p { background: #2383e2; color: #fff; } button.p:hover { background: #0f6fd0; }
  .x { position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; padding: 0; background: transparent; color: rgba(255,255,255,.5); font-size: 14px; line-height: 20px; }
</style></head>
<body><div class="card" id="card"><button class="x" id="x" aria-label="close">×</button><div class="t" id="t"></div><div class="s" id="s"></div><div class="row" id="row"></div></div>
<script src="./card.js"></script></body></html>
